# CloudOps Copilot — local development stack.
# Postgres (with pgvector) + FastAPI backend. Frontend runs separately in dev.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudops}
      POSTGRES_DB: ${POSTGRES_DB:-cloudops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-create extension + tables on first boot (idempotent; app also ensures schema).
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudops} -d ${POSTGRES_DB:-cloudops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - prod.env
    environment:
      # Inside the compose network the DB is reachable by service name "db".
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudops}:${POSTGRES_PASSWORD:-cloudops}@db:5432/${POSTGRES_DB:-cloudops}
      PORT: 8080
    volumes:
      # Mount the corpus so `docker compose exec backend python -m scripts.ingest`
      # can read data/urls.csv and cache fetched HTML in data/raw.
      - ./data:/data
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
